<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#07111d">
  <title>Titan Nova Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}?v=20260711-admin-overwrite">
</head>
<body class="bg-[#07111d] text-slate-100 overflow-x-hidden">
  <div id="toast" class="fixed top-4 left-1/2 -translate-x-1/2 z-[80] hidden max-w-[92vw] rounded-2xl border border-white/10 bg-[#101d2c]/95 px-4 py-3 text-sm font-bold shadow-2xl"></div>

  <header class="sticky top-0 z-40 border-b border-white/10 bg-[#07111d]/95 backdrop-blur">
    <div class="flex items-center gap-3 px-3 py-3">
      <button id="sidebarToggle" class="tap h-11 w-11 rounded-2xl bg-white/10"><i class="fa-solid fa-bars"></i></button>
      <div class="min-w-0 flex-1">
        <p class="text-[11px] font-black uppercase tracking-[.24em] text-[#2AABEE]">Titan Nova</p>
        <h1 id="pageTitle" class="truncate text-lg font-black">Admin Dashboard</h1>
      </div>
      <input id="datePicker" type="date" class="h-11 max-w-[138px] rounded-2xl border border-white/10 bg-white/5 px-2 text-xs font-bold outline-none">
      <button id="refreshBtn" class="tap h-11 w-11 rounded-2xl bg-[#2AABEE] text-white"><i class="fa-solid fa-rotate"></i></button>
    </div>
  </header>

  <aside id="sidebar" class="fixed inset-y-0 left-0 z-50 w-[290px] -translate-x-full border-r border-white/10 bg-[#0b1624] p-4 transition-transform duration-200">
    <div class="mb-4 flex items-center justify-between"><b class="text-xl">Controls</b><button id="closeSidebar" class="tap h-10 w-10 rounded-xl bg-white/10"><i class="fa-solid fa-xmark"></i></button></div>
    <div id="sideNav" class="grid gap-2"></div>
    <div class="mt-5 rounded-2xl border border-white/10 bg-white/5 p-3 text-xs text-slate-300">Admin can overwrite every setting from this single UI. Existing systems are reused; duplicate client-side modules are not created.</div>
  </aside>
  <div id="shade" class="fixed inset-0 z-40 hidden bg-black/60"></div>

  <main class="mx-auto w-full max-w-7xl px-3 pb-28 pt-3">
    <section id="installBanner" class="mb-3 hidden rounded-3xl border border-[#2AABEE]/30 bg-[#2AABEE]/10 p-4">
      <div class="flex items-center gap-3"><i class="fa-solid fa-mobile-screen-button text-2xl text-[#2AABEE]"></i><div class="flex-1"><b>Install Admin App</b><p class="text-xs text-slate-300">Fast mobile access ke liye PWA install karein.</p></div><button id="installBtn" class="btn-primary">Install</button></div>
    </section>
    <section id="content" class="min-h-[70vh]"></section>
  </main>

  <nav id="bottomNav" class="fixed bottom-0 left-0 right-0 z-40 border-t border-white/10 bg-[#07111d]/95 px-1 pb-[env(safe-area-inset-bottom)] pt-1 backdrop-blur"><div class="grid grid-cols-6 gap-1"></div></nav>

  <div id="targetModal" class="modal hidden"><div class="modal-card"><div class="flex items-center justify-between"><h3 class="text-lg font-black">Target Picker</h3><button data-close-modal class="tap h-10 w-10 rounded-xl bg-white/10"><i class="fa-solid fa-xmark"></i></button></div><input id="targetSearch" class="input mt-3" placeholder="Search groups/contacts"><div id="targetList" class="mt-3 max-h-[55vh] overflow-auto space-y-2"></div><button id="saveTargets" class="btn-primary mt-3 w-full">Save Targets</button></div></div>
  <div id="shareModal" class="modal hidden"><div class="modal-card"><div class="flex items-center justify-between"><h3 class="text-lg font-black">Share / Preview</h3><button data-close-modal class="tap h-10 w-10 rounded-xl bg-white/10"><i class="fa-solid fa-xmark"></i></button></div><textarea id="shareText" class="input mt-3 min-h-[180px]"></textarea><div class="mt-3 grid grid-cols-2 gap-2"><button id="copyShare" class="btn-soft">Copy</button><a id="waShare" class="btn-primary text-center" target="_blank">WhatsApp</a></div></div></div>

  <script>window.__BOOT_STATE__={{ state|tojson|safe }}; window.__IS_MASTER__={{ is_master|tojson|safe }};</script>
  <script src="{{ url_for('static', filename='app.js') }}?v=20260711-admin-overwrite"></script>
</body>
</html>
