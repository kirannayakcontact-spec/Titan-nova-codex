<!doctype html>
<html lang="en" class="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#17212B" />
  <link rel="manifest" href="/manifest.json" />
  <title>Titan Nova Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body class="bg-[#0B1118] text-slate-100 antialiased">
  <div id="app" class="min-h-screen pb-24">
    <header class="sticky top-0 z-40 border-b border-white/10 bg-[#111B26]/95 backdrop-blur">
      <div class="mx-auto flex max-w-7xl items-center gap-3 px-3 py-3">
        <button id="sidebarToggle" class="touch grid h-11 w-11 place-items-center rounded-2xl bg-white/5 text-[#2AABEE]"><i class="fa-solid fa-bars"></i></button>
        <div class="min-w-0 flex-1"><h1 class="truncate text-lg font-black tracking-tight">Titan Nova Admin</h1><p id="subTitle" class="truncate text-xs text-slate-400">Mobile-first WhatsApp bot control center</p></div>
        <input id="datePicker" type="date" class="hidden rounded-xl border border-white/10 bg-[#17212B] px-3 py-2 text-sm sm:block" />
        <button id="refreshBtn" class="touch rounded-2xl bg-[#2AABEE] px-4 py-2 text-sm font-black text-white"><i class="fa-solid fa-rotate"></i></button>
      </div>
    </header>

    <aside id="sidebar" class="fixed inset-y-0 left-0 z-50 w-80 -translate-x-full border-r border-white/10 bg-[#111B26] p-4 transition-transform">
      <div class="mb-4 flex items-center justify-between"><b class="text-xl">Titan Menu</b><button id="closeSidebar" class="touch h-11 w-11 rounded-xl bg-white/5"><i class="fa-solid fa-xmark"></i></button></div>
      <div id="sideTabs" class="grid gap-2"></div>
      <div class="mt-4 rounded-2xl border border-[#2AABEE]/30 bg-[#2AABEE]/10 p-3 text-xs text-slate-300">PWA ready. Use Install banner when shown.</div>
    </aside>
    <div id="scrim" class="fixed inset-0 z-40 hidden bg-black/60"></div>

    <main class="mx-auto max-w-7xl px-3 py-4">
      <section id="pwaBanner" class="mb-4 hidden rounded-3xl border border-[#2AABEE]/30 bg-gradient-to-r from-[#2AABEE]/20 to-[#00C26F]/10 p-4">
        <div class="flex items-center gap-3"><i class="fa-solid fa-mobile-screen-button text-2xl text-[#2AABEE]"></i><div class="flex-1"><b>Install Titan Nova</b><p class="text-xs text-slate-400">Fast home-screen admin access.</p></div><button id="installBtn" class="touch rounded-xl bg-[#00C26F] px-4 py-2 text-sm font-black">Install</button></div>
      </section>
      <div id="stats" class="mb-4 grid grid-cols-2 gap-3 md:grid-cols-4"></div>
      <section id="content"></section>
    </main>

    <nav id="bottomNav" class="fixed inset-x-0 bottom-0 z-30 border-t border-white/10 bg-[#111B26]/95 px-2 pb-[env(safe-area-inset-bottom)] pt-2 backdrop-blur"><div id="navTabs" class="no-scrollbar flex gap-2 overflow-x-auto"></div></nav>
  </div>

  <div id="targetModal" class="modal hidden"><div class="modal-card"><div class="flex items-center justify-between"><b>Select WhatsApp Targets</b><button data-close-modal class="touch h-10 w-10 rounded-xl bg-white/5"><i class="fa-solid fa-xmark"></i></button></div><input id="targetSearch" class="input mt-3" placeholder="Search groups / contacts"><div id="targetList" class="mt-3 max-h-[55vh] overflow-y-auto"></div><button id="saveTargets" class="touch mt-3 w-full rounded-2xl bg-[#2AABEE] py-3 font-black">Save targets</button></div></div>
  <div id="shareModal" class="modal hidden"><div class="modal-card"><div class="flex items-center justify-between"><b>Share / Preview</b><button data-close-modal class="touch h-10 w-10 rounded-xl bg-white/5"><i class="fa-solid fa-xmark"></i></button></div><textarea id="shareText" class="input mt-3 min-h-52"></textarea><button id="copyShare" class="touch mt-3 w-full rounded-2xl bg-[#00C26F] py-3 font-black">Copy / WhatsApp Share</button></div></div>
  <div id="toastWrap" class="fixed bottom-24 left-3 right-3 z-[70] grid gap-2 sm:left-auto sm:w-96"></div>
  <script>window.__BOOT_STATE__ = {{ state|tojson|safe if state is defined else '{}' }};</script>
  <script src="/static/app.js"></script>
</body>
</html>
