name: Titan Nova Smoke Test

on:
  pull_request:
  push:
    branches:
      - main
      - stability-cleanup-patch

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Titan smoke test
        run: python3 scripts/titan_smoke_test.py

      - name: Gateway syntax check
        run: node --check Gateway.js
