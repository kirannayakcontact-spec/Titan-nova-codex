name: Titan Nova Safety Check

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  python-check:
    name: Python syntax check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile Flask app and backend extensions
        run: python -m py_compile flask_app.py sitecustomize.py usercustomize.py

  node-check:
    name: Node dependency check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Node dependencies
        run: npm install

      - name: Check Gateway syntax
        run: node --check Gateway.js
