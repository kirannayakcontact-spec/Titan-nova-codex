name: Titan Nova Production Check

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  production-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install production dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          npm ci --omit=dev

      - name: Enforce the single result website
        run: python scripts/single_source_audit.py --result-source-only

      - name: Validate complete runtime
        run: python runtime_syntax_check.py

      - name: Validate gateway modules
        run: npm run check
